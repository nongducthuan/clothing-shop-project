services:
  postgres:
    image: postgres:16-alpine
    container_name: clothing_shop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: clothing_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clothing_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clothing_shop_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clothing_shop_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/clothing_shop?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      FRONTEND_URL: "http://localhost:5173"
      BACKEND_URL: "http://localhost:5000/api"
      JWT_SECRET: "development_super_secret_jwt_key_clothing_shop_123"
      JWT_REFRESH_SECRET: "development_super_secret_refresh_jwt_key_clothing_shop_456"
      STRICT_ENV_CHECK: "false"

volumes:
  postgres_data:
  redis_data:
